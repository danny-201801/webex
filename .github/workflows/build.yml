name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build 시작 (Mac)
        run: |
          pyinstaller --onefile --name webex_backup_start \
            --add-data "backup.py:." \
            start.py

      - name: Build 중지 (Mac)
        run: |
          pyinstaller --onefile --name webex_backup_stop \
            stop.py

      - name: Build 서버 (Mac)
        run: |
          pyinstaller --onefile --name webex_server \
            server.py

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-executables
          path: |
            dist/webex_backup_start
            dist/webex_backup_stop
            dist/webex_server

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build 시작 (Windows)
        run: |
          pyinstaller --onefile --name webex_backup_start `
            --add-data "backup.py;." `
            start.py

      - name: Build 중지 (Windows)
        run: |
          pyinstaller --onefile --name webex_backup_stop `
            stop.py

      - name: Build 서버 (Windows)
        run: |
          pyinstaller --onefile --noconsole --name webex_server `
            server.py

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            dist/webex_backup_start.exe
            dist/webex_backup_stop.exe
            dist/webex_server.exe

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release and Upload Assets
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Webex Backup ${{ github.ref_name }}" \
            --notes "## 다운로드
          | OS | 시작 | 중지 | 서버 |
          |----|------|------|------|
          | Mac | \`webex_backup_start\` | \`webex_backup_stop\` | \`webex_server\` |
          | Windows | \`webex_backup_start.exe\` | \`webex_backup_stop.exe\` | \`webex_server.exe\` |

          ## 사용법
          1. OS에 맞는 파일 3개를 **같은 폴더**에 다운로드
          2. \`webex_backup_start\` 더블클릭 → Webex 로그인 → 자동 백업 + 웹 뷰어 서버 설정
          3. 이후 부팅 시 자동으로 http://localhost:1985 에서 웹 뷰어 실행
          4. 중지(포트 1985 해제)하려면 \`webex_backup_stop\` 더블클릭" \
            artifacts/mac-executables/webex_backup_start \
            artifacts/mac-executables/webex_backup_stop \
            artifacts/mac-executables/webex_server \
            artifacts/windows-executables/webex_backup_start.exe \
            artifacts/windows-executables/webex_backup_stop.exe \
            artifacts/windows-executables/webex_server.exe
        env:
          GH_TOKEN: ${{ github.token }}
