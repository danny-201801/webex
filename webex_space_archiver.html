<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webex Space Archiver</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }
.container { max-width: 1000px; margin: 0 auto; padding: 20px; }

h1 { text-align: center; margin: 24px 0; font-size: 1.6em; color: #58a6ff; }
h1 span { color: #8b949e; font-weight: 300; font-size: 0.55em; display: block; margin-top: 6px; }

.card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; margin-bottom: 16px; }

/* Token */
.token-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.token-row input { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 8px; border: 1px solid #30363d;
  background: #0d1117; color: #e1e4e8; font-size: 14px; outline: none; }
.token-row input:focus { border-color: #58a6ff; }

.btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600;
  transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
.btn:disabled { background: #21262d !important; color: #484f58 !important; cursor: not-allowed; }
.btn-primary { background: #238636; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #2ea043; }
.btn-download { background: #1f6feb; color: #fff; }
.btn-download:hover:not(:disabled) { background: #388bfd; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-outline { background: transparent; border: 1px solid #30363d; color: #8b949e; }
.btn-outline:hover:not(:disabled) { border-color: #58a6ff; color: #58a6ff; }

.user-info { color: #3fb950; font-size: 14px; margin-top: 10px; }

.token-help { color: #8b949e; font-size: 12px; margin-top: 8px; }
.token-help a { color: #58a6ff; text-decoration: none; }
.token-help a:hover { text-decoration: underline; }

/* Search */
.search-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.search-row input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117;
  color: #e1e4e8; font-size: 14px; outline: none; }
.search-row input:focus { border-color: #58a6ff; }
.badge { background: #30363d; color: #8b949e; padding: 4px 10px; border-radius: 12px; font-size: 13px; white-space: nowrap; }
.badge-blue { background: #1a3a5c; color: #58a6ff; }

/* Space List */
.space-list { max-height: 420px; overflow-y: auto; border: 1px solid #30363d; border-radius: 8px; }
.space-list::-webkit-scrollbar { width: 8px; }
.space-list::-webkit-scrollbar-track { background: #161b22; }
.space-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

.space-item { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #21262d;
  cursor: pointer; transition: background 0.15s; gap: 12px; user-select: none; }
.space-item:hover { background: #1c2128; }
.space-item.selected { background: #122040; }
.space-item:last-child { border-bottom: none; }
.space-item input[type="checkbox"] { accent-color: #58a6ff; width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
.space-title { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.space-meta { color: #8b949e; font-size: 12px; white-space: nowrap; }
.space-type { background: #21262d; padding: 2px 8px; border-radius: 4px; font-size: 11px; color: #8b949e; }

/* Bottom */
.bottom-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; flex-wrap: wrap; gap: 10px; }
.select-actions { display: flex; gap: 10px; align-items: center; }
.select-actions label { font-size: 13px; color: #8b949e; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.select-actions label input { accent-color: #58a6ff; }

/* Progress */
.progress-wrap { margin-top: 14px; }
.progress-bar { width: 100%; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
.progress-bar .fill { height: 100%; background: linear-gradient(90deg, #1f6feb, #58a6ff); transition: width 0.3s; width: 0%; }
.status-text { text-align: center; padding: 8px 0; color: #8b949e; font-size: 13px; }

/* Results */
.result-item { padding: 8px 14px; border-radius: 6px; margin-top: 6px; font-size: 13px;
  display: flex; justify-content: space-between; align-items: center; }
.result-item.ok { background: #0d2818; border: 1px solid #238636; color: #3fb950; }
.result-item.fail { background: #2d1215; border: 1px solid #f85149; color: #f85149; }

.empty-state { text-align: center; padding: 40px; color: #484f58; }

.hidden { display: none !important; }

@media (max-width: 600px) {
  .token-row { flex-direction: column; }
  .bottom-bar { flex-direction: column; align-items: stretch; }
}
</style>
</head>
<body>
<div class="container">
  <h1>Webex Space Archiver <span>스페이스 메시지를 마크다운 파일로 저장합니다</span></h1>

  <!-- Token Card -->
  <div class="card">
    <div class="token-row">
      <input type="password" id="token" placeholder="Bearer Token을 입력하세요">
      <button class="btn btn-primary" id="connectBtn" onclick="connect()">연결</button>
    </div>
    <div class="token-help">
      <a href="https://developer.webex.com" target="_blank">developer.webex.com</a> → 로그인 → 개인 액세스 토큰 복사 (12시간 유효)
    </div>
    <div class="user-info hidden" id="userInfo"></div>
  </div>

  <!-- Main Panel -->
  <div class="card hidden" id="mainPanel">
    <div class="search-row">
      <input type="text" id="search" placeholder="스페이스 이름 검색..." oninput="filterSpaces()">
      <span class="badge" id="countBadge">0개</span>
    </div>

    <div class="space-list" id="spaceList">
      <div class="empty-state">연결 후 스페이스 목록이 표시됩니다.</div>
    </div>

    <div class="bottom-bar">
      <div class="select-actions">
        <label><input type="checkbox" id="selectAll" onchange="toggleAll()"> 전체 선택</label>
        <span class="badge badge-blue" id="selectedBadge">0개 선택</span>
      </div>
      <button class="btn btn-download" id="downloadBtn" onclick="downloadSelected()" disabled>
        다운로드
      </button>
    </div>

    <div class="progress-wrap hidden" id="progressWrap">
      <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
      <div class="status-text" id="statusText"></div>
    </div>
    <div id="results"></div>
  </div>
</div>

<script>
const API = 'https://webexapis.com/v1';
let token = '', allSpaces = [], filtered = [], selected = new Set(), peopleCache = {};

// ─── API helpers ─────────────────────────────────────────────────

async function webexGet(endpoint, params = {}) {
  const qs = new URLSearchParams(params).toString();
  const url = `${API}/${endpoint}${qs ? '?' + qs : ''}`;
  while (true) {
    const r = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
    if (r.status === 429) {
      const wait = parseInt(r.headers.get('Retry-After') || '5');
      await new Promise(res => setTimeout(res, wait * 1000));
      continue;
    }
    if (!r.ok) {
      const text = await r.text();
      throw new Error(`${r.status}: ${text.slice(0, 200)}`);
    }
    return r.json();
  }
}

// ─── Connect ─────────────────────────────────────────────────────

async function connect() {
  token = document.getElementById('token').value.trim();
  if (!token) return alert('토큰을 입력하세요.');

  const btn = document.getElementById('connectBtn');
  btn.disabled = true; btn.textContent = '연결 중...';

  try {
    const me = await webexGet('people/me');
    const name = me.displayName || '';
    const email = (me.emails || [''])[0];

    const data = await webexGet('rooms', { max: 1000, sortBy: 'lastactivity' });
    allSpaces = data.items || [];

    document.getElementById('userInfo').textContent = `✓ ${name} (${email}) — ${allSpaces.length}개 스페이스`;
    document.getElementById('userInfo').classList.remove('hidden');
    document.getElementById('mainPanel').classList.remove('hidden');

    btn.textContent = '연결됨';
    btn.style.background = '#1a7f37';
    filterSpaces();
  } catch (e) {
    alert('연결 실패: ' + e.message);
    btn.disabled = false;
    btn.textContent = '연결';
  }
}

// ─── Filter & Render ─────────────────────────────────────────────

function filterSpaces() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  filtered = q ? allSpaces.filter(s => (s.title || '').toLowerCase().includes(q)) : [...allSpaces];
  renderList();
}

function renderList() {
  const list = document.getElementById('spaceList');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
  } else {
    list.innerHTML = filtered.map(s => {
      const checked = selected.has(s.id) ? 'checked' : '';
      const cls = selected.has(s.id) ? 'selected' : '';
      const type = s.type === 'direct' ? '1:1' : '그룹';
      const date = (s.lastActivity || '').slice(0, 10);
      return `<div class="space-item ${cls}" onclick="toggleSpace('${s.id}')">
        <input type="checkbox" ${checked} onclick="event.stopPropagation(); toggleSpace('${s.id}')">
        <span class="space-title">${esc(s.title || 'Untitled')}</span>
        <span class="space-type">${type}</span>
        <span class="space-meta">${date}</span>
      </div>`;
    }).join('');
  }
  document.getElementById('countBadge').textContent = filtered.length + '개';
  updateSelected();
}

function toggleSpace(id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  renderList();
}

function toggleAll() {
  const all = document.getElementById('selectAll').checked;
  selected.clear();
  if (all) filtered.forEach(s => selected.add(s.id));
  renderList();
}

function updateSelected() {
  document.getElementById('selectedBadge').textContent = selected.size + '개 선택';
  document.getElementById('downloadBtn').disabled = selected.size === 0;
}

// ─── HTML → Markdown ─────────────────────────────────────────────

function htmlToMd(html) {
  if (!html) return '';
  const doc = new DOMParser().parseFromString(html, 'text/html');
  return nodeToMd(doc.body).replace(/\n{3,}/g, '\n\n').trim();
}

function nodeToMd(node) {
  let out = '';
  for (const child of node.childNodes) {
    if (child.nodeType === 3) { out += child.textContent; continue; }
    if (child.nodeType !== 1) continue;
    const tag = child.tagName.toLowerCase();
    const inner = nodeToMd(child);
    switch (tag) {
      case 'b': case 'strong': out += `**${inner}**`; break;
      case 'i': case 'em': out += `*${inner}*`; break;
      case 'code': out += `\`${inner}\``; break;
      case 'pre': out += `\n\`\`\`\n${inner}\n\`\`\`\n`; break;
      case 'br': out += '\n'; break;
      case 'p': out += inner + '\n'; break;
      case 'blockquote': out += '\n> ' + inner.split('\n').join('\n> ') + '\n'; break;
      case 'li': out += '- ' + inner + '\n'; break;
      case 'ul': case 'ol': out += '\n' + inner; break;
      case 'a': out += `[${inner}](${child.getAttribute('href') || ''})`; break;
      case 'h1': out += `# ${inner}\n`; break;
      case 'h2': out += `## ${inner}\n`; break;
      case 'h3': out += `### ${inner}\n`; break;
      case 'img': out += `![image](${child.getAttribute('src') || ''})`; break;
      default: out += inner;
    }
  }
  return out;
}

// ─── Archive & Download ──────────────────────────────────────────

async function getMemberships(roomId) {
  const data = await webexGet('memberships', { roomId, max: 500 });
  const items = data.items || [];
  items.forEach(m => { if (m.personId) peopleCache[m.personId] = m.personDisplayName || 'Unknown'; });
  return items;
}

async function getMessages(roomId, statusCb) {
  let msgs = [], params = { roomId, max: 500 }, page = 1;
  while (msgs.length < 5000) {
    if (statusCb) statusCb(`메시지 수집 중... (페이지 ${page}, ${msgs.length}개)`);
    const data = await webexGet('messages', params);
    const items = data.items || [];
    if (!items.length) break;
    msgs.push(...items);
    if (items.length < 500) break;
    params.beforeMessage = items[items.length - 1].id;
    page++;
  }
  return msgs;
}

function fmtTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0') + ':' +
      String(d.getSeconds()).padStart(2,'0');
  } catch { return iso; }
}

function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toISOString().slice(0, 10); } catch { return ''; }
}

async function archiveSpace(roomId, statusCb) {
  if (statusCb) statusCb('스페이스 정보 조회 중...');
  const space = await webexGet(`rooms/${roomId}`);
  const title = space.title || 'Untitled';

  if (statusCb) statusCb('멤버 목록 조회 중...');
  const members = await getMemberships(roomId);

  const messages = await getMessages(roomId, statusCb);
  messages.sort((a, b) => (a.created || '').localeCompare(b.created || ''));

  // Thread grouping
  const threads = {}, roots = [];
  messages.forEach(m => {
    if (m.parentId) { (threads[m.parentId] = threads[m.parentId] || []).push(m); }
    else roots.push(m);
  });

  if (statusCb) statusCb('마크다운 생성 중...');
  const now = fmtTime(new Date().toISOString());
  let md = `# ${title}\n\n`;
  md += `> 아카이브 생성일: ${now}\n`;
  md += `> 스페이스 유형: ${space.type || ''}\n`;
  md += `> 총 메시지 수: ${messages.length}\n`;
  md += `> 멤버 수: ${members.length}\n\n`;

  md += `## 멤버\n\n`;
  members.sort((a, b) => (a.personDisplayName || '').localeCompare(b.personDisplayName || ''));
  members.forEach(m => {
    const mod = m.isModerator ? ' (관리자)' : '';
    md += `- ${m.personDisplayName || 'Unknown'} (${m.personEmail || ''})${mod}\n`;
  });
  md += `\n## 메시지\n\n`;

  let curDate = '';
  roots.forEach(msg => {
    const d = fmtDate(msg.created);
    if (d && d !== curDate) { curDate = d; md += `### ${curDate}\n\n`; }

    const name = peopleCache[msg.personId] || (msg.personEmail || '').split('@')[0] || 'Unknown';
    const ts = fmtTime(msg.created);
    const text = htmlToMd(msg.html) || msg.text || '';
    const files = (msg.files || []).map(() => '  - 📎 첨부파일').join('\n');

    md += `**${name}** | \`${ts}\`\n`;
    md += text + (files ? '\n' + files : '') + '\n\n';

    // Replies
    if (threads[msg.id]) {
      threads[msg.id].forEach(reply => {
        const rn = peopleCache[reply.personId] || (reply.personEmail || '').split('@')[0];
        const rts = fmtTime(reply.created);
        const rt = htmlToMd(reply.html) || reply.text || '';
        md += `> **${rn}** | \`${rts}\` ↩️ (답글)\n`;
        rt.split('\n').forEach(l => { md += l.trim() ? `> ${l}\n` : '>\n'; });
        md += '\n';
      });
    }
    md += '---\n\n';
  });

  return { title, md, msgCount: messages.length, memCount: members.length };
}

function downloadFile(filename, content) {
  const blob = new Blob([content], { type: 'text/markdown; charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function safeName(title) {
  return title.replace(/[^\w\s가-힣-]/g, '').trim().replace(/\s+/g, '_');
}

async function downloadSelected() {
  const ids = [...selected];
  if (!ids.length) return;

  const btn = document.getElementById('downloadBtn');
  const wrap = document.getElementById('progressWrap');
  const fill = document.getElementById('progressFill');
  const status = document.getElementById('statusText');
  const results = document.getElementById('results');

  btn.disabled = true;
  wrap.classList.remove('hidden');
  results.innerHTML = '';

  for (let i = 0; i < ids.length; i++) {
    const s = allSpaces.find(x => x.id === ids[i]);
    const sname = s ? s.title : ids[i];
    status.textContent = `[${i + 1}/${ids.length}] ${sname}`;
    fill.style.width = (i / ids.length * 100) + '%';

    try {
      const { title, md, msgCount, memCount } = await archiveSpace(ids[i], t => { status.textContent = `[${i+1}/${ids.length}] ${sname} — ${t}`; });
      const ts = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 15);
      const fname = `${safeName(title)}_${ts}.md`;
      downloadFile(fname, md);
      results.innerHTML += `<div class="result-item ok">✓ ${esc(title)} — ${msgCount}개 메시지, ${memCount}명 → ${esc(fname)}</div>`;
    } catch (e) {
      results.innerHTML += `<div class="result-item fail">✗ ${esc(sname)}: ${esc(e.message)}</div>`;
    }
    fill.style.width = ((i + 1) / ids.length * 100) + '%';
  }

  status.textContent = '완료!';
  btn.disabled = false;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Enter key to connect
document.getElementById('token').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
</script>
</body>
</html>
