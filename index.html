<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webex Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0f1117; color: #e1e4e8; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── 로그인 ── */
#loginScreen { display: flex; align-items: center; justify-content: center; flex: 1; gap: 20px; flex-wrap: wrap; padding: 20px; }
.login-box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 32px; width: 400px; }
.login-box h2 { color: #e1e4e8; font-size: 1.1em; margin-bottom: 6px; }
.login-box p { color: #8b949e; font-size: 12px; margin-bottom: 18px; line-height: 1.5; }
.login-box p a { color: #58a6ff; text-decoration: none; }
.login-box input[type="password"], .login-box input[type="text"] {
  width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #30363d;
  background: #0d1117; color: #e1e4e8; font-size: 14px; outline: none; margin-bottom: 10px; }
.login-box input:focus { border-color: #58a6ff; }
.btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:disabled { background: #21262d !important; color: #484f58 !important; cursor: not-allowed; }
.btn-green { background: #238636; color: #fff; width: 100%; }
.btn-green:hover:not(:disabled) { background: #2ea043; }
.btn-blue { background: #1f6feb; color: #fff; width: 100%; }
.btn-blue:hover:not(:disabled) { background: #388bfd; }
.btn-outline { background: transparent; border: 1px solid #30363d; color: #8b949e; }
.btn-outline:hover:not(:disabled) { border-color: #58a6ff; color: #58a6ff; }
.btn-red { background: #da3633; color: #fff; }
.btn-red:hover:not(:disabled) { background: #f85149; }
.divider { text-align: center; color: #484f58; font-size: 12px; margin: 8px 0; }
.login-error { color: #f85149; font-size: 12px; margin-top: 8px; }
.hidden { display: none !important; }
.file-drop { border: 2px dashed #30363d; border-radius: 8px; padding: 24px; text-align: center; color: #8b949e; font-size: 13px; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; }
.file-drop:hover { border-color: #58a6ff; color: #58a6ff; }

/* ── 앱 ── */
#appScreen { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.topbar { background: #161b22; border-bottom: 1px solid #30363d; padding: 0 16px; height: 50px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 10px; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-title { color: #58a6ff; font-weight: 700; font-size: 1em; white-space: nowrap; }
.topbar-user { color: #8b949e; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.mode-live { background: #0d2818; color: #3fb950; border: 1px solid #238636; }
.mode-offline { background: #1a3a5c; color: #58a6ff; border: 1px solid #1f6feb; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.main { display: flex; flex: 1; overflow: hidden; }

/* ── 사이드바 ── */
.sidebar { width: 260px; flex-shrink: 0; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
.sidebar-search { padding: 10px; border-bottom: 1px solid #30363d; }
.sidebar-search input { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e1e4e8; font-size: 13px; outline: none; }
.sidebar-search input:focus { border-color: #58a6ff; }
.space-list { flex: 1; overflow-y: auto; }
.space-list::-webkit-scrollbar { width: 5px; }
.space-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
.space-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #21262d; transition: background 0.12s; }
.space-item:hover { background: #1c2128; }
.space-item.active { background: #122040; border-left: 3px solid #58a6ff; }
.space-item-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.space-item-meta { font-size: 11px; color: #8b949e; margin-top: 3px; display: flex; justify-content: space-between; }
.space-tag { background: #21262d; padding: 1px 6px; border-radius: 4px; }

/* ── 채팅 ── */
.chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.chat-header { padding: 12px 18px; border-bottom: 1px solid #30363d; background: #161b22; flex-shrink: 0; }
.chat-header h2 { font-size: 15px; font-weight: 600; }
.chat-header p { font-size: 12px; color: #8b949e; margin-top: 2px; }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 2px; }
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
.date-sep { text-align: center; margin: 14px 0 6px; position: relative; }
.date-sep span { background: #21262d; color: #8b949e; font-size: 11px; padding: 3px 12px; border-radius: 10px; position: relative; z-index: 1; }
.date-sep::before { content:''; position: absolute; left:0; right:0; top:50%; height:1px; background:#30363d; }
.msg-group { display: flex; flex-direction: column; margin-bottom: 6px; }
.msg-group.me { align-items: flex-end; }
.msg-group.other { align-items: flex-start; }
.msg-sender { font-size: 11px; color: #8b949e; margin-bottom: 3px; padding: 0 4px; }
.bubble { max-width: 65%; padding: 8px 12px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; }
.msg-group.me .bubble { background: #1a4a8a; color: #e1e4e8; border-bottom-right-radius: 4px; }
.msg-group.other .bubble { background: #21262d; color: #e1e4e8; border-bottom-left-radius: 4px; }
.bubble code { background: rgba(0,0,0,0.3); padding: 1px 5px; border-radius: 4px; font-family: monospace; font-size: 12px; }
.bubble pre { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; margin: 4px 0; }
.bubble a { color: #58a6ff; }
.bubble strong { font-weight: 600; }
.bubble blockquote { border-left: 3px solid #484f58; padding-left: 8px; color: #8b949e; margin: 4px 0; }
.msg-time { font-size: 10px; color: #484f58; margin-top: 2px; padding: 0 4px; }
.msg-group.me .msg-time { text-align: right; }
.attach-tag { font-size: 11px; color: #8b949e; margin-top: 3px; padding: 0 4px; }
.msg-group.me .attach-tag { text-align: right; }
.attach-list { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
.attach-item { font-size: 12px; display: flex; align-items: center; gap: 6px; }
.attach-name { color: #8b949e; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach-saved { color: #3fb950; font-size: 11px; }
.attach-notsaved { color: #f0883e; font-size: 11px; }
.attach-name-link { color: #58a6ff; text-decoration: none; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach-name-link:hover { text-decoration: underline; }
.attach-item-img { flex-direction: column; align-items: flex-start; gap: 4px; }
.attach-thumb { max-width: 200px; max-height: 150px; border-radius: 6px; display: block; cursor: pointer; }
.thread-wrap { margin-top: 4px; padding-left: 10px; border-left: 2px solid #30363d; display: flex; flex-direction: column; gap: 3px; }
.msg-group.me .thread-wrap { padding-left: 0; padding-right: 10px; border-left: none; border-right: 2px solid #30363d; align-items: flex-end; }
.load-more-btn { margin: 0 auto 12px; padding: 6px 18px; border-radius: 8px; border: 1px solid #30363d; background: transparent; color: #8b949e; font-size: 12px; cursor: pointer; }
.load-more-btn:hover { border-color: #58a6ff; color: #58a6ff; }
.loading { display: flex; align-items: center; justify-content: center; flex: 1; color: #8b949e; font-size: 14px; gap: 10px; }
.spinner { width: 18px; height: 18px; border: 2px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-chat { display: flex; align-items: center; justify-content: center; flex: 1; color: #484f58; font-size: 14px; flex-direction: column; gap: 8px; }
.empty-chat .icon { font-size: 36px; opacity: 0.3; }

/* ── 백업 모달 ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 28px; width: 480px; max-width: 90vw; }
.modal h3 { font-size: 1em; margin-bottom: 16px; color: #e1e4e8; }
.progress-bar { width: 100%; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.progress-fill { height: 100%; background: linear-gradient(90deg,#1f6feb,#58a6ff); transition: width 0.3s; width: 0%; }
.progress-text { font-size: 13px; color: #8b949e; text-align: center; margin-bottom: 6px; }
.progress-detail { font-size: 11px; color: #484f58; text-align: center; min-height: 16px; }
.modal-btns { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginScreen">
  <!-- 라이브 연결 -->
  <div class="login-box">
    <h2>🔴 라이브 연결</h2>
    <p>Webex 계정으로 로그인해 실시간 대화를 보거나 전체 백업합니다.</p>
    <button class="btn btn-green" id="oauthBtn" onclick="startOAuth()">Webex로 로그인</button>
    <div class="divider">또는</div>
    <input type="password" id="tokenInput" placeholder="Bearer Token 직접 입력 (12시간 유효)" />
    <button class="btn btn-outline" id="connectBtn" onclick="connectLive()" style="width:100%;margin-top:4px">토큰으로 연결</button>
    <div class="login-error hidden" id="loginError"></div>
  </div>

  <!-- 백업 파일 열기 -->
  <div class="login-box">
    <h2>📂 백업 파일 열기</h2>
    <p>이전에 저장한 백업 JSON 파일을 불러와 오프라인으로 대화 내용을 확인합니다.</p>
    <div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()">
      클릭하거나 파일을 여기에 드래그하세요<br>
      <small style="font-size:11px; margin-top:4px; display:block;">webex_backup_*.json</small>
    </div>
    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="loadBackupFile(event)">
    <div class="login-error hidden" id="fileError"></div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="appScreen">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">Webex Viewer</span>
      <span class="mode-badge" id="modeBadge"></span>
      <span class="topbar-user" id="topbarUser"></span>
    </div>
    <div class="topbar-right">
      <button class="btn btn-outline" id="backupBtn" onclick="document.getElementById('backupStartModal').classList.remove('hidden')" style="font-size:13px; padding:6px 14px;">전체 백업 다운로드</button>
      <button class="btn btn-outline" onclick="document.getElementById('inAppFileInput').click()" style="font-size:13px; padding:6px 14px;">📂 백업 파일 열기</button>
      <input type="file" id="inAppFileInput" accept=".json" style="display:none" onchange="loadBackupInApp(event)">
      <button class="btn btn-outline" onclick="location.reload()" style="font-size:13px; padding:6px 14px;">← 나가기</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-search">
        <input type="text" id="spaceSearch" placeholder="스페이스 검색..." oninput="filterSpaces()">
      </div>
      <div class="space-list" id="spaceList"></div>
    </div>
    <div class="chat-area" id="chatArea">
      <div class="empty-chat"><div class="icon">💬</div><div>좌측에서 스페이스를 선택하세요</div></div>
    </div>
  </div>
</div>

<!-- 백업 시작 선택 모달 -->
<div class="modal-overlay hidden" id="backupStartModal">
  <div class="modal">
    <h3>⬇️ 백업 방식 선택</h3>
    <p style="margin:8px 0 16px;color:#666;font-size:13px;">이전 백업 파일을 불러오면 변경된 스페이스만 업데이트합니다.</p>
    <div class="modal-btns" style="flex-direction:column;gap:10px;">
      <button class="btn btn-primary" onclick="pickPrevBackup(false)" style="width:100%">📂 증분 업데이트 (JSON)</button>
      <button class="btn btn-primary" onclick="pickPrevBackup(true)" style="width:100%;background:#1a5c2a;">📦 증분 업데이트 + 첨부파일 (ZIP)</button>
      <button class="btn btn-outline" onclick="startBackup(null, false)" style="width:100%">처음부터 전체 백업 (JSON)</button>
      <button class="btn btn-outline" onclick="startBackup(null, true)" style="width:100%;border-color:#3fb950;color:#3fb950;">📦 처음부터 전체 백업 + 첨부파일 (ZIP)</button>
      <button class="btn btn-red" onclick="document.getElementById('backupStartModal').classList.add('hidden')" style="width:100%">취소</button>
    </div>
    <input type="file" id="prevBackupInput" accept=".json" style="display:none" onchange="onPrevBackupSelected(event)">
  </div>
</div>

<!-- 백업 진행 모달 -->
<div class="modal-overlay hidden" id="backupModal">
  <div class="modal">
    <h3>⬇️ 전체 백업 중...</h3>
    <div class="progress-bar"><div class="progress-fill" id="bkFill"></div></div>
    <div class="progress-text" id="bkText">준비 중...</div>
    <div class="progress-detail" id="bkDetail"></div>
    <div class="modal-btns">
      <button class="btn btn-red" id="bkCancelBtn" onclick="cancelBackup()">중단</button>
    </div>
  </div>
</div>

<script>
// localhost면 server.py 프록시 사용, 그 외(GitHub Pages 등)는 직접 호출
const API = location.hostname === 'localhost' ? '/api' : 'https://webexapis.com/v1';
let token = '', myId = '', myName = '';
let allSpaces = [], filtered = [];
let peopleCache = {};
let currentRoomId = null;
let roomCache = {};
let isLiveMode = true;
let backupCancelled = false;

// ── API ───────────────────────────────────────────────────────────

async function webexGet(endpoint, params = {}) {
  const qs = new URLSearchParams(params).toString();
  const url = `${API}/${endpoint}${qs ? '?' + qs : ''}`;
  while (true) {
    const r = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (r.status === 429) { await sleep(parseInt(r.headers.get('Retry-After')||'5') * 1000); continue; }
    if (!r.ok) { const t = await r.text(); throw new Error(`${r.status}: ${t.slice(0,200)}`); }
    return r.json();
  }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ── 라이브 연결 ───────────────────────────────────────────────────

async function connectLive() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) return;
  const btn = document.getElementById('connectBtn');
  const err = document.getElementById('loginError');
  btn.disabled = true; btn.textContent = '연결 중...';
  err.classList.add('hidden');
  try {
    btn.textContent = '사용자 확인 중...';
    const me = await webexGet('people/me');
    myId = me.id; myName = me.displayName || '';
    peopleCache[myId] = myName;

    btn.textContent = '스페이스 목록 불러오는 중...';
    const data = await webexGet('rooms', { max: 1000, sortBy: 'lastactivity' });
    allSpaces = data.items || [];

    isLiveMode = true;
    enterApp(myName + ' (' + (me.emails||[''])[0] + ')', true);
  } catch(e) {
    let msg = e.message||String(e);
    if (msg.includes('401')) msg = '토큰이 올바르지 않거나 만료되었습니다.';
    else if (msg.includes('Failed to fetch')) msg = '네트워크 오류 - server.py가 실행 중인지 확인하세요.';
    err.textContent = '연결 실패: ' + msg;
    err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = '연결';
  }
}

// ── 백업 파일 열기 ────────────────────────────────────────────────

function setupFileDrop() {
  const drop = document.getElementById('fileDrop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.borderColor='#58a6ff'; });
  drop.addEventListener('dragleave', () => { drop.style.borderColor=''; });
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.style.borderColor='';
    const file = e.dataTransfer.files[0];
    if (file) parseBackupFile(file);
  });
}

function loadBackupFile(e) {
  const file = e.target.files[0];
  if (file) parseBackupFile(file);
}

function parseBackupFile(file) {
  const err = document.getElementById('fileError');
  err.classList.add('hidden');
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.spaces || !data.me) throw new Error('올바른 백업 파일이 아닙니다.');
      myId = data.me.id || '';
      myName = data.me.displayName || '';
      peopleCache = data.people || {};

      allSpaces = data.spaces.map(s => ({
        id: s.id, title: s.title, type: s.type, lastActivity: s.lastActivity
      }));

      // 메시지를 roomCache에 미리 로드
      data.spaces.forEach(s => {
        roomCache[s.id] = { messages: s.messages || [], hasMore: false, oldestId: null };
      });

      isLiveMode = false;
      enterApp(`${myName} (백업 파일: ${file.name})`, false);
    } catch(e) {
      err.textContent = e.message;
      err.classList.remove('hidden');
    }
  };
  reader.readAsText(file);
}

// ── 앱 진입 ───────────────────────────────────────────────────────

function enterApp(userLabel, live) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  document.getElementById('topbarUser').textContent = userLabel;
  const badge = document.getElementById('modeBadge');
  badge.textContent = live ? '● 라이브' : '● 오프라인';
  badge.className = 'mode-badge ' + (live ? 'mode-live' : 'mode-offline');
  document.getElementById('backupBtn').style.display = live ? '' : 'none';
  filterSpaces();
}

// ── 사이드바 ──────────────────────────────────────────────────────

function filterSpaces() {
  const q = document.getElementById('spaceSearch').value.trim().toLowerCase();
  filtered = q ? allSpaces.filter(s => (s.title||'').toLowerCase().includes(q)) : [...allSpaces];
  renderSidebar();
}

function renderSidebar() {
  document.getElementById('spaceList').innerHTML = filtered.map(s => {
    const active = s.id === currentRoomId ? 'active' : '';
    const type = s.type === 'direct' ? '1:1' : '그룹';
    const date = (s.lastActivity||'').slice(0,10);
    return `<div class="space-item ${active}" onclick="openSpace('${s.id}')">
      <div class="space-item-name">${esc(s.title||'Untitled')}</div>
      <div class="space-item-meta"><span class="space-tag">${type}</span><span>${date}</span></div>
    </div>`;
  }).join('');
}

// ── 채팅 열기 ─────────────────────────────────────────────────────

async function openSpace(roomId) {
  if (currentRoomId === roomId) return;
  currentRoomId = roomId;
  renderSidebar();
  const space = allSpaces.find(s => s.id === roomId) || {};
  const chatArea = document.getElementById('chatArea');
  chatArea.innerHTML = `
    <div class="chat-header"><h2>${esc(space.title||'Untitled')}</h2><p>불러오는 중...</p></div>
    <div class="loading"><div class="spinner"></div> 메시지 불러오는 중...</div>`;
  try {
    if (!roomCache[roomId]) await loadMessages(roomId, null);
    renderChat(roomId, space);
  } catch(e) {
    chatArea.innerHTML = `<div class="empty-chat"><div>오류: ${esc(e.message)}</div></div>`;
  }
}

async function loadMessages(roomId, beforeId) {
  const params = { roomId, max: 200 };
  if (beforeId) params.beforeMessage = beforeId;
  const data = await webexGet('messages', params);
  const items = data.items || [];
  await resolvePeople(items.map(m=>m.personId));
  const sorted = [...items].sort((a,b)=>(a.created||'').localeCompare(b.created||''));
  if (!roomCache[roomId]) {
    roomCache[roomId] = { messages: sorted, hasMore: items.length===200, oldestId: items.length?items[items.length-1].id:null };
  } else {
    roomCache[roomId].messages = [...sorted, ...roomCache[roomId].messages];
    roomCache[roomId].hasMore = items.length===200;
    roomCache[roomId].oldestId = items.length?items[items.length-1].id:null;
  }
}

async function resolvePeople(ids) {
  const unknowns = [...new Set(ids.filter(id=>id && !peopleCache[id]))];
  await Promise.allSettled(unknowns.map(async id => {
    try { const p = await webexGet(`people/${id}`); peopleCache[id] = p.displayName||(p.emails||[''])[0]||'Unknown'; }
    catch { peopleCache[id] = 'Unknown'; }
  }));
}

// ── 채팅 렌더링 ───────────────────────────────────────────────────

function renderChat(roomId, space) {
  const { messages, hasMore } = roomCache[roomId];
  const threads = {}, roots = [];
  messages.forEach(m => { if (m.parentId) (threads[m.parentId]=threads[m.parentId]||[]).push(m); else roots.push(m); });

  const chatArea = document.getElementById('chatArea');
  let html = `
    <div class="chat-header">
      <h2>${esc(space.title||'Untitled')}</h2>
      <p>${space.type==='direct'?'1:1 대화':'그룹 스페이스'} · ${messages.length}개 메시지</p>
    </div>
    <div class="chat-messages" id="msgContainer">`;

  if (hasMore) html += `<button class="load-more-btn" onclick="loadMore('${roomId}')">이전 메시지 더 보기</button>`;

  let curDate = '';
  roots.forEach(msg => {
    const d = fmtDate(msg.created);
    if (d && d !== curDate) { curDate = d; html += `<div class="date-sep"><span>${curDate}</span></div>`; }
    html += renderMsgGroup(msg, threads[msg.id]||[]);
  });

  html += `</div>`;
  chatArea.innerHTML = html;
  const c = document.getElementById('msgContainer');
  if (c) c.scrollTop = c.scrollHeight;
}

function renderMsgGroup(msg, replies) {
  const isMe = msg.personId === myId;
  const side = isMe ? 'me' : 'other';
  const name = peopleCache[msg.personId] || (msg.personEmail||'').split('@')[0] || 'Unknown';
  const content = renderContent(msg);
  let html = `<div class="msg-group ${side}">`;
  if (!isMe) html += `<div class="msg-sender">${esc(name)}</div>`;
  html += `<div class="bubble">${content}</div>`;
  if (msg.files?.length) html += renderAttachments(msg);
  html += `<div class="msg-time">${fmtTime(msg.created)}</div>`;
  if (replies.length) {
    html += `<div class="thread-wrap">`;
    replies.forEach(r => {
      const rIsMe = r.personId===myId;
      const rn = peopleCache[r.personId]||(r.personEmail||'').split('@')[0]||'Unknown';
      html += `<div class="msg-group ${rIsMe?'me':'other'}" style="margin-bottom:2px">`;
      if (!rIsMe) html += `<div class="msg-sender" style="font-size:10px">${esc(rn)} ↩</div>`;
      else html += `<div class="msg-sender" style="font-size:10px">↩ 답글</div>`;
      html += `<div class="bubble" style="font-size:13px">${renderContent(r)}</div>`;
      html += `<div class="msg-time">${fmtTime(r.created)}</div></div>`;
    });
    html += `</div>`;
  }
  return html + `</div>`;
}

function renderContent(msg) {
  if (msg.html) return sanitizeHtml(msg.html);
  return esc(msg.text||'').replace(/\n/g,'<br>');
}

function renderAttachments(msg) {
  const urls   = msg.files      || [];
  const locals = msg.localFiles || [];
  const ext = f => (f||'').split('.').pop().toLowerCase();
  const imgExts = new Set(['jpg','jpeg','png','gif','webp','bmp','svg']);
  const isServer = location.hostname === 'localhost';

  let html = '<div class="attach-list">';
  for (let i = 0; i < urls.length; i++) {
    const local = locals[i];  // e.g. "files/<space_id>/<filename>"
    const name  = local ? local.split('/').pop() : `첨부파일 ${i+1}`;
    const isImg = local && imgExts.has(ext(local));

    if (local && isServer) {
      // server.py로 실행 중: /files/... 경로로 직접 링크
      const href = '/' + local.replace(/\\/g, '/');
      if (isImg) {
        html += `<div class="attach-item attach-item-img">
                   <a href="${esc(href)}" target="_blank"><img src="${esc(href)}" alt="${esc(name)}" class="attach-thumb"></a>
                   <a href="${esc(href)}" download="${esc(name)}" class="attach-name-link">🖼️ ${esc(name)}</a>
                 </div>`;
      } else {
        html += `<div class="attach-item">
                   📎 <a href="${esc(href)}" download="${esc(name)}" class="attach-name-link">${esc(name)}</a>
                 </div>`;
      }
    } else if (local) {
      // 오프라인 모드: 파일은 있지만 브라우저에서 직접 접근 불가
      html += `<div class="attach-item">📎 <span class="attach-name">${esc(name)}</span>
               <span class="attach-saved" title="${esc(local)}">✅ 로컬 저장됨</span></div>`;
    } else {
      html += `<div class="attach-item">📎 <span class="attach-name">첨부파일 ${i+1}</span>
               <span class="attach-notsaved">⚠️ 미저장</span></div>`;
    }
  }
  html += '</div>';
  return html;
}

function sanitizeHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const allowed = new Set(['b','strong','i','em','code','pre','br','p','a','ul','ol','li','blockquote','h1','h2','h3','span','div']);
  function clean(node) {
    for (const child of [...node.childNodes]) {
      if (child.nodeType===3) continue;
      if (child.nodeType!==1) { child.remove(); continue; }
      const tag = child.tagName.toLowerCase();
      if (!allowed.has(tag)) { while(child.firstChild) child.before(child.firstChild); child.remove(); continue; }
      [...child.attributes].map(a=>a.name).filter(a=>a!=='href').forEach(a=>child.removeAttribute(a));
      if (tag==='a') { child.setAttribute('target','_blank'); child.setAttribute('rel','noopener'); }
      clean(child);
    }
  }
  clean(doc.body);
  return doc.body.innerHTML;
}

async function loadMore(roomId) {
  const { oldestId } = roomCache[roomId];
  const btn = document.querySelector('.load-more-btn');
  if (btn) { btn.disabled=true; btn.textContent='불러오는 중...'; }
  const container = document.getElementById('msgContainer');
  const prevH = container?.scrollHeight || 0;
  await loadMessages(roomId, oldestId);
  const space = allSpaces.find(s=>s.id===roomId)||{};
  renderChat(roomId, space);
  const nc = document.getElementById('msgContainer');
  if (nc) nc.scrollTop = nc.scrollHeight - prevH;
}

let _pickIncludeFiles = false;
function pickPrevBackup(includeFiles) {
  _pickIncludeFiles = includeFiles;

}

function onPrevBackupSelected(e) {
  const file = e.target.files[0];
  if (!file) return;

    } catch {
      alert('백업 파일을 읽을 수 없습니다.');
    }
  };

}

async function startBackup(prevBackup, includeFiles) {
  backupCancelled = false;
  document.getElementById('backupStartModal').classList.add('hidden');
  document.getElementById('backupModal').classList.remove('hidden');
  setProgress(0, '스페이스 목록 확인 중...', '');

  // 이전 백업에서 spaceId → {lastActivity, messages} 맵 구성
  const prevMap = {};
  if (prevBackup && Array.isArray(prevBackup.spaces)) {
    for (const s of prevBackup.spaces) {
      prevMap[s.id] = { lastActivity: s.lastActivity, messages: s.messages || [] };
    }
  }
  const isIncremental = Object.keys(prevMap).length > 0;

  try {
    let spaces = [], cursor = null;
    while (true) {
      const params = { max: 1000, sortBy: 'lastactivity' };
      if (cursor) params.cursor = cursor;
      const data = await webexGet('rooms', params);
      spaces.push(...(data.items||[]));
      if (!data.next || (data.items||[]).length < 1000) break;
      cursor = new URL(data.next).searchParams.get('cursor');
    }

    const backup = {
      version: 2,
      exportedAt: new Date().toISOString(),
      me: { id: myId, displayName: myName },
      people: prevBackup ? Object.assign({}, prevBackup.people) : {},
      spaces: []
    };

    let skipped = 0;
    for (let i = 0; i < spaces.length; i++) {
      if (backupCancelled) break;
      const s = spaces[i];
      const pct = Math.round(i / spaces.length * 100);
      const prev = prevMap[s.id];

      // lastActivity 동일하면 스킵
      if (isIncremental && prev && prev.lastActivity === s.lastActivity) {
        backup.spaces.push({ id:s.id, title:s.title, type:s.type, lastActivity:s.lastActivity, messages: prev.messages });
        skipped++;
        setProgress(pct, `[${i+1}/${spaces.length}] ${s.title||'Untitled'}`, `변경 없음 (스킵 ${skipped}개)`);
        continue;
      }

      setProgress(pct, `[${i+1}/${spaces.length}] ${s.title||'Untitled'}`, '메시지 수집 중...');

      try {
        let messages;
        if (isIncremental && prev && prev.messages.length > 0) {
          // 마지막 메시지 이후 신규 메시지만 가져오기
          const lastMsg = prev.messages[prev.messages.length - 1];
          const newMsgs = await getMessagesSince(s.id, lastMsg.id, (pg, cnt) => {
            setProgress(pct, `[${i+1}/${spaces.length}] ${s.title||'Untitled'}`, `신규 메시지 ${cnt}개 수집 중 (페이지 ${pg})`);
          });
          messages = prev.messages.concat(newMsgs);
        } else {
          messages = await getAllMessages(s.id, (pg, cnt) => {
            setProgress(pct, `[${i+1}/${spaces.length}] ${s.title||'Untitled'}`, `메시지 ${cnt}개 수집 중 (페이지 ${pg})`);
          });
        }
        messages.forEach(m => { if (m.personId && !backup.people[m.personId]) backup.people[m.personId] = peopleCache[m.personId] || ''; });
        backup.spaces.push({ id:s.id, title:s.title, type:s.type, lastActivity:s.lastActivity, messages });
      } catch(e) {
        const fallback = (isIncremental && prev) ? prev.messages : [];
        backup.spaces.push({ id:s.id, title:s.title, type:s.type, lastActivity:s.lastActivity, messages: fallback, error:e.message });
      }
    }

    // people 이름 채우기
    const unknown = Object.keys(backup.people).filter(id => !backup.people[id]);
    for (let i=0; i<unknown.length; i+=10) {
      if (backupCancelled) break;
      setProgress(99, '사용자 이름 조회 중...', `${i}/${unknown.length}`);
      const batch = unknown.slice(i, i+10);
      await Promise.allSettled(batch.map(async id => {
        try { const p = await webexGet(`people/${id}`); backup.people[id] = p.displayName||(p.emails||[''])[0]||'Unknown'; }
        catch { backup.people[id] = 'Unknown'; }
      }));
    }

    if (!backupCancelled) {
      const ts = new Date().toISOString().replace(/[-:T]/g,'').slice(0,15);

      if (includeFiles) {
        // ZIP 모드: 첨부파일 다운로드 후 묶기
        setProgress(100, '첨부파일 다운로드 중...', '');
        const zip = new JSZip();
        const filesFolder = zip.folder('files');
        let fileTotal = 0, fileDone = 0;

        // 전체 파일 수 집계
        for (const sp of backup.spaces)
          for (const m of sp.messages||[])
            fileTotal += (m.files||[]).length;

        for (const sp of backup.spaces) {
          if (backupCancelled) break;
          const spaceFolder = filesFolder.folder(sp.id);
          for (const m of sp.messages||[]) {
            if (backupCancelled) break;
            const urls = m.files || [];
            if (!urls.length) continue;
            const localPaths = [];
            for (let i = 0; i < urls.length; i++) {
              fileDone++;
              setProgress(100, `첨부파일 다운로드 중... (${fileDone}/${fileTotal})`, sp.title||'');
              try {
                const resp = await fetch(urls[i], { headers: { Authorization: `Bearer ${token}` } });
                if (!resp.ok) { localPaths.push(null); continue; }
                const cd = resp.headers.get('Content-Disposition') || '';
                let fname = '';
                const m5 = cd.match(/filename\*=UTF-8''([^;]+)/i);
                if (m5) fname = decodeURIComponent(m5[1]);
                if (!fname) { const m6 = cd.match(/filename="([^"]+)"/); if (m6) fname = m6[1]; }
                if (!fname) fname = urls[i].split('/').pop().split('?')[0] || `file_${i}`;
                const safeName = `${m.id.slice(-8)}_${fname}`;
                const buf = await resp.arrayBuffer();
                spaceFolder.file(safeName, buf);
                localPaths.push(`files/${sp.id}/${safeName}`);
              } catch { localPaths.push(null); }
            }
            if (localPaths.some(p=>p)) m.localFiles = localPaths;
          }
        }

        setProgress(100, 'ZIP 생성 중...', '');
        zip.file('backup.json', JSON.stringify(backup));
        const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `webex_attach_files_${ts}.zip`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      } else {
        setProgress(100, '완료! 파일 저장 중...', '');
        downloadJson(`webex_backup_${ts}.json`, backup);
      }

      setTimeout(() => document.getElementById('backupModal').classList.add('hidden'), 1500);
    } else {
      document.getElementById('backupModal').classList.add('hidden');
    }
  } catch(e) {
    alert('백업 오류: ' + e.message);
    document.getElementById('backupModal').classList.add('hidden');
  }
}

// afterMessageId 이후 신규 메시지만 수집 (최신→과거 순 API 특성상 afterMessage 파라미터 사용)
async function getMessagesSince(roomId, afterMessageId, onProgress) {
  let msgs = [], page = 1;
  const params = { roomId, max: 500 };
  while (true) {
    if (backupCancelled) break;
    if (onProgress) onProgress(page, msgs.length);
    const data = await webexGet('messages', params);
    const items = data.items || [];
    if (!items.length) break;
    // API는 최신→과거 순으로 반환, afterMessageId를 만나면 중단
    let done = false;
    for (const m of items) {
      if (m.id === afterMessageId) { done = true; break; }
      msgs.push(m);
    }
    if (done || items.length < 500) break;
    params.beforeMessage = items[items.length-1].id;
    page++;
  }
  return msgs.sort((a,b)=>(a.created||'').localeCompare(b.created||''));
}

async function getAllMessages(roomId, onProgress) {
  let msgs = [], params = { roomId, max: 500 }, page = 1;
  while (true) {
    if (backupCancelled) break;
    if (onProgress) onProgress(page, msgs.length);
    const data = await webexGet('messages', params);
    const items = data.items || [];
    if (!items.length) break;
    msgs.push(...items);
    if (items.length < 500) break;
    params.beforeMessage = items[items.length-1].id;
    page++;
  }
  return msgs.sort((a,b)=>(a.created||'').localeCompare(b.created||''));
}

function cancelBackup() { backupCancelled = true; }

function setProgress(pct, text, detail) {
  document.getElementById('bkFill').style.width = pct + '%';
  document.getElementById('bkText').textContent = text;

function downloadJson(filename, data) {
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function fmtTime(iso) {
  if (!iso) return '';
  try { const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); } catch { return ''; }
}
function fmtDate(iso) {
  if (!iso) return '';
  try { const d=new Date(iso); return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.'; } catch { return ''; }
}
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function loadBackupInApp(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();

      document.getElementById('backupBtn').style.display = 'none';
      document.getElementById('chatArea').innerHTML = '<div class="empty-chat"><div class="icon">💬</div><div>좌측에서 스페이스를 선택하세요</div></div>';
      filterSpaces();
    } catch(e) { alert('파일 오류: ' + e.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── OAuth PKCE ────────────────────────────────────────────────────
const OAUTH_CLIENT_ID     = 'Cd4487bf7672af986eba5ea41653f415b2f7addc435d5b5f944cb65a9084484eb';
const OAUTH_CLIENT_SECRET = 'd41e3d7db6acefe75b9ee5c73c29d3fc2bc50fff9f9d4e8e2ac685b0e7971916';
const OAUTH_REDIRECT_URI  = 'https://danny-201801.github.io/webex/';
const OAUTH_AUTH_URL      = 'https://webexapis.com/v1/authorize';
const OAUTH_TOKEN_URL     = 'https://webexapis.com/v1/access_token';

function genPKCE() {
  const arr = new Uint8Array(64);
  crypto.getRandomValues(arr);
  const verifier = btoa(String.fromCharCode(...arr)).replace(/[+/=]/g, c => ({'+':'-','/':'_','=':''}[c]));
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)).then(buf => {
    const challenge = btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/[+/=]/g, c => ({'+':'-','/':'_','=':''}[c]));
    return { verifier, challenge };
  });
}

async function startOAuth() {
  const { verifier, challenge } = await genPKCE();
  sessionStorage.setItem('pkce_verifier', verifier);
  const state = crypto.getRandomValues(new Uint8Array(8)).join('');
  sessionStorage.setItem('oauth_state', state);
  const params = new URLSearchParams({
    client_id: OAUTH_CLIENT_ID,
    response_type: 'code',
    redirect_uri: OAUTH_REDIRECT_URI,
    scope: 'spark:all',
    code_challenge: challenge,
    code_challenge_method: 'S256',
    state,
  });
  location.href = `${OAUTH_AUTH_URL}?${params}`;
}

async function handleOAuthCallback() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if (!code) return;

  // URL에서 code 파라미터 제거
  history.replaceState({}, '', location.pathname);

  const verifier = sessionStorage.getItem('pkce_verifier');
  sessionStorage.removeItem('pkce_verifier');
  sessionStorage.removeItem('oauth_state');

  const err = document.getElementById('loginError');
  const btn = document.getElementById('oauthBtn');
  btn.disabled = true; btn.textContent = '로그인 처리 중...';

  try {
    const body = new URLSearchParams({
      grant_type: 'authorization_code',
      client_id: OAUTH_CLIENT_ID,
      client_secret: OAUTH_CLIENT_SECRET,
      code,
      redirect_uri: OAUTH_REDIRECT_URI,
      code_verifier: verifier,
    });
    const resp = await fetch(OAUTH_TOKEN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    if (!resp.ok) throw new Error(`토큰 교환 실패: ${resp.status}`);
    const tokens = await resp.json();
    token = tokens.access_token;
    // refresh token은 localStorage에 저장 (재방문시 자동 로그인)
    if (tokens.refresh_token) {
      localStorage.setItem('wx_refresh', tokens.refresh_token);
      localStorage.setItem('wx_expires', Date.now() + (tokens.expires_in - 300) * 1000);
    }
    await connectWithToken();
  } catch(e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Webex로 로그인';
  }
}

async function tryAutoLogin() {
  const refresh = localStorage.getItem('wx_refresh');
  const expires = localStorage.getItem('wx_expires');
  if (!refresh) return;
  if (Date.now() < Number(expires)) {
    // 저장된 토큰이 아직 유효 - refresh로 갱신
    try {
      const body = new URLSearchParams({
        grant_type: 'refresh_token',
        client_id: OAUTH_CLIENT_ID,
        client_secret: OAUTH_CLIENT_SECRET,
        refresh_token: refresh,
      });
      const resp = await fetch(OAUTH_TOKEN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      });
      if (!resp.ok) { localStorage.removeItem('wx_refresh'); return; }
      const tokens = await resp.json();
      token = tokens.access_token;
      if (tokens.refresh_token) {
        localStorage.setItem('wx_refresh', tokens.refresh_token);
        localStorage.setItem('wx_expires', Date.now() + (tokens.expires_in - 300) * 1000);
      }
      await connectWithToken();
    } catch { localStorage.removeItem('wx_refresh'); }
  }
}

async function connectWithToken() {
  const btn = document.getElementById('oauthBtn');
  const err = document.getElementById('loginError');
  btn.disabled = true; btn.textContent = '불러오는 중...';
  err.classList.add('hidden');
  try {
    const me = await webexGet('people/me');
    myId = me.id; myName = me.displayName || '';
    peopleCache[myId] = myName;
    const data = await webexGet('rooms', { max: 1000, sortBy: 'lastactivity' });
    allSpaces = data.items || [];
    isLiveMode = true;
    enterApp(myName + ' (' + (me.emails||[''])[0] + ')', true);
  } catch(e) {
    err.textContent = '연결 실패: ' + e.message;
    err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Webex로 로그인';
  }
}

document.getElementById('tokenInput').addEventListener('keydown', e => { if (e.key==='Enter') connectLive(); });
setupFileDrop();

// 페이지 로드시: OAuth 콜백 처리 or 자동 로그인 시도
if (location.search.includes('code=')) {
  handleOAuthCallback();
} else {
  tryAutoLogin();
}
</script>
</body>
</html>
